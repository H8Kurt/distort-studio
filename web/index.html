<!doctype html>
<html lang="ru" data-theme="dark" data-palette="blood" data-skin="cyber">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/distort.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Distort Studio — соцсеть и git для художников и музыкантов: проекты, версии, коллабы, магазин ассетов. Gothic Y2K / dark retro internet."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tektur:wght@400..900&family=Unbounded:wght@400..900&family=Pixelify+Sans:wght@400..700&family=Manrope:wght@400..800&family=JetBrains+Mono:wght@400..700&family=Noto+Sans+JP:wght@400;700&family=Press+Start+2P&family=VT323&family=Mochiy+Pop+P+One&family=Yomogi&family=Caveat:wght@400..700&family=UnifrakturMaguntia&family=Ruslan+Display&display=swap"
      rel="stylesheet"
    />

    <title>Distort Studio — memento mori · тёмная сторона сцены</title>

    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        var p = localStorage.getItem("palette");
        if (p) document.documentElement.setAttribute("data-palette", p);
        var s = localStorage.getItem("skin");
        if (s === "cyber" || s === "webcore") document.documentElement.setAttribute("data-skin", s);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
